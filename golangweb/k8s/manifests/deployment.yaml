# This is a sample deployment manifest file for a simple web application.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-web
  labels:
    app: golang-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golang-web
  template:
    metadata:
      labels:
        app: golang-web
    spec:
      containers:
      - name: golang-web
        image: rugvedi/golangweb:v1
        ports:
        - containerPort: 8080